name: release

# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match package.json version $v" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Already on npm?
        id: npm
        run: |
          pkg="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$v" version >/dev/null 2>&1; then
            echo "$pkg@$v is already published; skipping npm publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could PCS help? Alternatives you considered are welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked CONTRIBUTING.md: this is not cross-machine sync, a central server or a GUI
          required: true

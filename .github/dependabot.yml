version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned on purpose (see docs/DECISIONS.md, quality gates).
      - dependency-name: "@emnapi/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      website-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 breaks the Nextra build (readFile of undefined). Nextra supports TypeScript 5 and 6.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
